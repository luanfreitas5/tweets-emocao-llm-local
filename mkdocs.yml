# =============================================================================
# mkdocs.yml — documentação com MkDocs Material + mkdocstrings.
# API gerada a partir das docstrings NumPy (pt-BR). Publicada via docs.yml.
#   uv run mkdocs serve      # local
#   uv run mkdocs gh-deploy  # publicar
# =============================================================================

site_name: Tweets Emoção & Tópicos — LLM Local
site_description: Python calcula (BERTimbau + BERTopic), LLM local (Ollama) apenas explica.
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Modo escuro
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - content.code.copy

plugins:
  - search:
      lang: pt
  - mkdocstrings:
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Guias:
      - Setup: guides/setup.md
      - Uso: guides/usage.md
      - Arquitetura: guides/architecture.md
  - Referência da API: reference.md
