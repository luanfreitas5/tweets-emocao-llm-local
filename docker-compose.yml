# =============================================================================
# docker-compose.yml — API + Ollama (LLM local) + MLflow (tracking e registry).
# Tudo local: nenhum dado sai da máquina. `docker compose config -q` valida o arquivo.
# Segredos/variáveis vêm do .env (nunca commitado); veja .env.example.
# =============================================================================
services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      # SQLite dentro do volume nomeado (4 barras = caminho absoluto). Use Postgres se for compartilhado.
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      # MLflow >= 3.5 valida o Host: inclua o nome do serviço ou a API recebe 403
      - --allowed-hosts=mlflow:5000,localhost:5000
    volumes:
      - mlflow_db:/mlflow
      - mlartifacts:/mlartifacts
    ports:
      - "127.0.0.1:5000:5000" # só na máquina local; o MLflow não tem autenticação por padrão
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:?defina OLLAMA_VERSION no .env (ex.: tag atual do Docker Hub)}
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    # Descomente para usar GPU NVIDIA:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-desconhecido} # make docker-build injeta o SHA do commit
    image: tweets-emocao-api:${API_VERSION:-dev}
    environment:
      OLLAMA_HOST: http://ollama:11434
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - hf_cache:/hf # pesos do Transformer fora da imagem
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true # sistema de arquivos imutável; só /tmp, /app/logs e o cache HF são graváveis
    tmpfs:
      - /tmp
      - /app/logs:uid=10001,gid=10001 # o logging em arquivo precisa de diretório gravável
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  mlflow_db:
  mlartifacts:
  ollama_models:
  hf_cache:
