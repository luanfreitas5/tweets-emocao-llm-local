# =============================================================================
# paths.yaml — caminhos de dados, modelos e saídas (relativos à raiz do projeto).
# Resolvidos para pathlib.Path em src/config/paths.py.
#
# Camadas de dados (arquitetura medalhão):
#   bronze — dados exatamente como recebidos (imutável; nunca modificar).
#   silver — limpos, tipados, deduplicados e validados por contrato (pandera).
#   gold   — prontos para modelo/negócio (predições, tópicos).
# =============================================================================

data:
  bronze: "data/bronze"
  silver: "data/silver"
  gold: "data/gold"

# Arquivos-chave do fluxo.
files:
  # Bronze: base rotulada por supervisão distante (emoticons / hashtags).
  bronze_tweets: "data/bronze/NoThemeTweets.csv"
  # Silver: saída da limpeza (contrato: ProcessedTweetsSchema).
  silver_tweets: "data/silver/tweets_processed.parquet"
  # Gold: saída da classificação de sentimento.
  sentiment_predictions: "data/gold/sentiment_predictions.parquet"
  # Gold: saída da modelagem de tópicos.
  topic_assignments: "data/gold/topic_assignments.parquet"
  # JSON estruturado consumido pelo LLM (entrada do resumo).
  insights_json: "reports/insights.json"
  # Resumo em linguagem simples gerado pelo LLM local.
  summary_markdown: "reports/summary.md"
  # Métricas de avaliação (versionadas: o README cita este arquivo).
  classification_metrics: "reports/metrics/classification.json"

models:
  root: "models"
  topic_model: "models/bertopic"

reports:
  root: "reports"
  figures: "reports/figures"
  metrics: "reports/metrics"

logs: "logs"
