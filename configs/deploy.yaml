# =============================================================================
# deploy.yaml — configuração da API FastAPI (serving local).
# =============================================================================

api:
  title: "Tweets Emoção & Tópicos — LLM Local"
  version: "0.1.0"
  host: "127.0.0.1"
  port: 8000
  # CORS restrito a localhost por padrão (privacidade: uso local).
  cors_allow_origins:
    - "http://localhost"
    - "http://127.0.0.1"

# Limites de payload para os endpoints de inferência.
limits:
  max_texts_per_request: 256
  max_text_length: 512
