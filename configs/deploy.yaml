# =============================================================================
# deploy.yaml — configuração da API FastAPI (serving local) e do registry.
# =============================================================================

api:
  title: "Tweets Emoção & Tópicos — LLM Local"
  version: "0.2.0"
  host: "127.0.0.1"
  port: 8000
  # Carrega o modelo de sentimento no startup: o serviço falha ao subir se o
  # modelo não carregar, em vez de falhar na primeira requisição.
  preload_model: true
  # CORS restrito a localhost por padrão (privacidade: uso local).
  cors_allow_origins:
    - "http://localhost"
    - "http://127.0.0.1"

# Limites de payload para os endpoints de inferência (422 quando excedidos).
limits:
  max_texts_per_request: 256
  max_text_length: 512

# MLflow Model Registry (mesmo backend SQLite do tracking; use o servidor do
# docker-compose via MLFLOW_TRACKING_URI quando o registry for compartilhado).
registry:
  registry_uri: "sqlite:///mlruns/mlflow.db"
